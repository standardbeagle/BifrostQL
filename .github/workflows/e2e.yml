name: E2E (Desktop UI)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  playwright:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.1
      - name: Setup Node
        # The current Node LTS, as in every workflow. This job was pinned to 22
        # while Playwright's ESM loader called `.includes()` on the `conditions`
        # Set that Node 24+ passes; @playwright/test 1.62+ wraps it in a Set.
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Build desktop UI SPA
        # wwwroot is Vite output and gitignored, so CI must build it before the
        # dotnet build: the UI host tests serve it, and the .UI csproj copies
        # wwwroot/** into bin. The script installs the workspace, builds the
        # packages the SPA imports, then the SPA (the same script local test runs use).
        run: ./scripts/build-ui-spa.sh
      - name: Install Playwright browsers
        run: pnpm --dir tests/BifrostQL.UI.E2E exec playwright install --with-deps chromium
      - name: Setup .NET 10.0
        # global-setup.ts builds and runs src/BifrostQL.UI (net10.0-only) headless.
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Run Playwright E2E suite
        # Self-contained: global-setup.ts builds+starts BifrostQL.UI in
        # --headless mode with no connection string. Specs drive the bundled
        # "Try it now" quickstart schemas, which seed an in-memory SQLite DB
        # from embedded SQL resources — no external DB or GUI required.
        run: pnpm --dir tests/BifrostQL.UI.E2E test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/BifrostQL.UI.E2E/playwright-report
          retention-days: 14
