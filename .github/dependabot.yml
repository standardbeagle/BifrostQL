version: 2
updates:
  # .NET dependencies across every csproj in the repo (src, tests, samples,
  # benchmarks). Grouped so a single PR carries a coherent bump set.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      dotnet-dependencies:
        patterns:
          - "*"
    # These packages' major version is the .NET release they ship with, so
    # it moves with the TargetFrameworks, not with a weekly bump. #53 tried
    # to put the .NET 11 line on libraries that target net8.0/net9.0/net10.0
    # (Data.Sqlite.Core 11 ships no net8.0/net9.0 build). It also rewrote the
    # net8.0/net9.0-conditioned ASP.NET test hosts to 10.x, because Dependabot
    # can't follow per-framework conditions. Patch and minor updates still
    # arrive as usual.
    ignore:
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.Configuration*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.DependencyInjection*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.Logging*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Data.Sqlite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.IO.Hashing"
        update-types: ["version-update:semver-major"]

  # GitHub Actions used by the workflows below.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Node tooling for the React editor / SPA packages (pnpm workspace).
  # Only minor/patch bumps are grouped: the grouped PR of 2026-09-01 (#18)
  # mixed TypeScript 7, React 19 and Vite 8 with 44 routine bumps, and the
  # majors broke tsconfig (TS5108/TS5102) so nothing could merge. Majors now
  # arrive as one PR each and are migrated deliberately.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
