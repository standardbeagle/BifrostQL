packages:
  - docs
  - examples/*
  - packages/*
  - packages/@bifrostql/*
  - samples/HostedSpa/spa
  - src/BifrostQL.UI/frontend
  - tests/BifrostQL.UI.E2E
allowBuilds:
  '@swc/core': true
  esbuild: true
  sharp: true
# Transitive security pins. pnpm >=10 reads overrides from this file, not from
# package.json's "pnpm" block — keep them here or they silently do nothing.
overrides:
  ajv: ^8.20.0
  # ESLint 8's config loader hard-requires the ajv 6 constructor API; the
  # blanket ajv 8 pin above crashed every `pnpm lint` in the workspace
  # ("Cannot set properties of undefined (setting 'defaultMeta')"). 6.12.6
  # carries the fix for the ajv 6 advisory (prototype pollution, <6.12.3);
  # `pnpm audit` stays clean with these scoped exceptions.
  'eslint>ajv': ^6.12.6
  '@eslint/eslintrc>ajv': ^6.12.6
  brace-expansion@1: ^1.1.22
  brace-expansion@2: ^2.1.4
  brace-expansion@5: ^5.0.13
  esbuild: ^0.28.1
  fast-uri: ^3.1.9
  form-data: ^4.0.6
  js-yaml: ^4.3.2
  nanoid: ^3.3.17
  postcss: ^8.5.18
  postcss-selector-parser@6: ^6.1.6
  sharp: ^0.35.5
  source-map-js: ^1.2.2
  svgo: ^4.1.0
