packages:
  - docs
  - examples/*
  - packages/*
  - packages/@bifrostql/*
  - samples/HostedSpa/spa
  - src/BifrostQL.UI/frontend
  - tests/BifrostQL.UI.E2E
allowBuilds:
  '@swc/core': true
  esbuild: true
  sharp: true
# Transitive security pins. pnpm >=10 reads overrides from this file, not from
# package.json's "pnpm" block — keep them here or they silently do nothing.
overrides:
  ajv: ^8.20.0
  brace-expansion@1: ^1.1.18
  brace-expansion@2: ^2.1.4
  brace-expansion@5: ^5.0.9
  esbuild: ^0.28.1
  fast-uri: ^3.1.5
  form-data: ^4.0.6
  js-yaml: ^4.3.1
  nanoid: ^3.3.17
  postcss: ^8.5.18
  sharp: ^0.35.3
  svgo: ^4.0.2
