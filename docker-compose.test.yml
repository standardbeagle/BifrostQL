# Local test databases for tests/BifrostQL.Integration.Test.
#
# Ports are loopback-only and offset from the engines' defaults so they never
# collide with a host Postgres/MySQL/SQL Server or another project's containers.
# The connection strings that point at them live in
# tests/BifrostQL.Integration.Test/local-databases.runsettings, which every
# local `dotnet test` of that project picks up. CI does not use this file: it
# runs its own service containers on the default ports (.github/workflows/dotnet.yml).
#
#   docker compose -f docker-compose.test.yml up -d --wait   # scripts/test-epic.sh does this
#   docker compose -f docker-compose.test.yml down
#
# restart: unless-stopped keeps them up across reboots, so a bare `dotnet test`
# (worktrack command steps, an IDE) finds them without going through a script.
name: bifrost-test

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bifrost-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Bifrost!CI!Test1234"
    ports:
      - "127.0.0.1:51433:1433"
    healthcheck:
      test: >
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Bifrost!CI!Test1234' -No -Q 'SELECT 1'
        || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Bifrost!CI!Test1234' -Q 'SELECT 1'
        || exit 1
      interval: 5s
      retries: 30
      start_period: 30s

  postgres:
    image: postgres:16
    container_name: bifrost-pg
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: bifrost_ci_test
      POSTGRES_DB: bifrost_ci
    ports:
      - "127.0.0.1:55440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20
      start_period: 10s

  mysql:
    image: mysql:8.4
    container_name: bifrost-mysql
    restart: unless-stopped
    # CI raises max_connections to 500 before the release tier (dotnet.yml); the
    # net8/net9/net10 test hosts run in parallel and exhaust the default 151.
    command: --max-connections=500
    environment:
      MYSQL_ROOT_PASSWORD: bifrost_ci_test
      MYSQL_DATABASE: bifrost_ci
    ports:
      - "127.0.0.1:53306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -pbifrost_ci_test"]
      interval: 5s
      retries: 30
      start_period: 30s
